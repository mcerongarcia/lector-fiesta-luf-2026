<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel en vivo · Fiesta Multicultural LUF 2026</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#063b83,#0786cc 55%,#12a488);display:grid;place-items:center}.wrap{width:min(1200px,94vw);text-align:center}.school{font-weight:800;letter-spacing:.12em;font-size:clamp(13px,1.5vw,20px)}h1{font-size:clamp(36px,6vw,80px);margin:12px 0 6px}.sub{font-size:clamp(17px,2.3vw,29px);margin:0 0 34px;opacity:.92}.main{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}.card{background:#ffffffed;color:#073e91;border-radius:28px;padding:28px;box-shadow:0 14px 34px #00285155}.card strong{font-size:clamp(65px,11vw,155px);line-height:1;color:#087d43;display:block}.card span,.mini span{font-size:clamp(16px,2vw,27px);font-weight:800}.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mini{background:#ffffffdd;color:#073e91;border-radius:20px;padding:18px}.mini b{display:block;font-size:clamp(31px,5vw,65px);color:#087d43;margin-bottom:6px}.footer{margin-top:28px;font-size:clamp(14px,1.8vw,22px);font-weight:bold}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#6dff9a;margin-right:8px}@media(max-width:620px){.main{gap:12px}.card{padding:20px 10px}.minirow{gap:8px}.mini{padding:13px 5px}}
</style></head><body><main class="wrap"><div class="school">LICEO LUIS URBINA FLORES</div><h1>Fiesta Multicultural LUF 2026</h1><p class="sub">Panel de asistencia en vivo</p><section class="main"><div class="card"><strong id="registered">—</strong><span>Personas preinscritas</span></div><div class="card"><strong id="entered">—</strong><span>Personas que han ingresado</span></div></section><section class="minirow"><div class="mini"><b id="groups">—</b><span>Grupos preinscritos</span></div><div class="mini"><b id="students">—</b><span>Estudiantes</span></div><div class="mini"><b id="guardians">—</b><span>Apoderados/as</span></div><div class="mini"><b id="guests">—</b><span>Invitados/as y menores</span></div></section><p class="footer"><span class="dot"></span>Actualización automática · Última actualización: <span id="updated">—</span></p></main><script>
const API='https://script.google.com/macros/s/AKfycbynTPghWm911IBglrJEe54kF1vsViGMI_M4rrlvMvFnhzw2r_Gyf57RJ-MqhmF9bjfW/exec';
function jsonp(){return new Promise((resolve,reject)=>{const cb='panel_'+Date.now(),s=document.createElement('script'),t=setTimeout(()=>done(()=>reject()),30000);function done(f){clearTimeout(t);s.remove();delete window[cb];f()}window[cb]=d=>done(()=>resolve(d));s.onerror=()=>done(()=>reject());s.src=API+'?api=dashboard&callback='+cb;document.body.appendChild(s)})}
function load(){jsonp().then(d=>{if(!d.ok)return;document.getElementById('registered').textContent=d.peopleRegistered;document.getElementById('entered').textContent=d.peopleEntered;document.getElementById('groups').textContent=d.groupsRegistered;document.getElementById('students').textContent=d.students;document.getElementById('guardians').textContent=d.guardians;document.getElementById('guests').textContent=d.guests;document.getElementById('updated').textContent=d.updatedAt}).catch(()=>{document.getElementById('updated').textContent='reintentando…'})}load();setInterval(load,10000);
</script></body></html>
